name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate content
        run: node tools/validate.mjs

      # Plays every place headlessly: flood-fills the walkable ground from each
      # spawn, drives the real movement code on foot and on the bike with seeded
      # input, walks the travel routes and the cut scenes, and lays out every
      # caption at both ends of the console's resolution range. No browser
      # needed, so it runs before the Playwright install and fails fast.
      - name: Play the game headless
        run: node tools/playtest.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Boot the console in a browser
        run: node tools/browser-check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: samples/browser
          if-no-files-found: ignore
